# Linux packaging for the Electron shell. Run through `pnpm dist:linux`, which builds the web UI, the API
# bundle and the shell first: this file only assembles what those steps left in dist/ folders.
appId: io.github.yeyo11.claudio
productName: Claudio
copyright: Copyright © 2026 Jose Antonio Garrido
artifactName: Claudio-${version}-${arch}.${ext}

# The launcher finds a running window by its X11 WM_CLASS, which Electron derives from the packaged
# package.json name, not from app.setName(). Left as "@claudio/desktop" it became "claudio-desktop",
# matched nothing, and the dock showed a generic icon. desktopName does the same for Wayland (app id).
extraMetadata:
  name: claudio
  desktopName: claudio.desktop

# Where electron-updater looks for releases. With it, the build also writes latest-linux.yml (versions,
# file names and SHA-512s of the AppImage and the .deb), app-update.yml in the resources and
# resources/package-type in the .deb. The AppImage's blockmap, for differential downloads, is embedded in it.
# It never publishes: dist:linux passes --publish never, and .github/workflows/desktop.yml uploads
# everything to the draft release itself.
publish:
  provider: github
  owner: yeyo11
  repo: claudio

# Clears group and other write permission from the packed tree, whatever the builder's umask: the guards
# refuse a group-writable guard.mjs (scripts/after-pack.mjs)
afterPack: ./scripts/after-pack.mjs

directories:
  output: release
  buildResources: build

# The main process and preload are esbuild bundles and the API is a self-contained bundle, so nothing from
# node_modules has to ship (node-pty, below, is the one exception and goes through extraResources): only
# the compiled shell and its package.json (electron-builder adds the latter).
# That also sidesteps the symlinked pnpm node_modules, which app-builder cannot walk reliably.
files:
  - dist/**/*
  - '!dist/**/*.map'
  - package.json

# Paths the shell reads at runtime (src/resources.ts): <resources>/server/server.mjs, the MCP server beside it
# (<resources>/server/mcp.mjs), the guard program (<resources>/server/guard.mjs), the terminal host (<resources>/server/terminal-host.mjs),
# the Collaborators host (<resources>/server/collab-host.mjs) and <resources>/web/index.html.
extraResources:
  - from: ../api/dist
    to: server
    filter:
      - server.mjs
      - mcp.mjs
      - guard.mjs
      - terminal-host.mjs
      - collab-host.mjs
  # node-pty, staged by the API's bundle script (package.json, lib/ and the Linux x64 prebuild, with pnpm's
  # symlinks dereferenced). Its own entry: electron-builder drops node_modules/ from a filtered copy, so
  # listing it in the filter above shipped nothing. Node's resolution from terminal-host.mjs finds it here
  - from: ../api/dist/node_modules/node-pty
    to: server/node_modules/node-pty
  # @number0/iroh and its Linux x64 binding, staged the same way, for collab-host.mjs (docs/plans/collaborators.md §3.2)
  - from: ../api/dist/node_modules/@number0
    to: server/node_modules/@number0
  - from: ../web/dist
    to: web
  # The window's own icon (src/resources.ts); without it the running window has no _NET_WM_ICON
  - from: build/icons/512x512.png
    to: icon.png

# Nothing is rebuilt: the SQLite store is node:sqlite, built into the Node that Electron ships, and the
# one native module, node-pty, is a N-API prebuild (pinned 1.2.0-beta.15) that loads on Electron's Node
# as it is. A version without the Linux prebuild would need this changed.
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

# Text and JS compress well; the API bundle and the UI are the bulk of the payload
compression: normal

linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  executableName: claudio
  category: Development
  icon: build/icons
  synopsis: Desktop UI for Claude Code agents
  description: >-
    Claudio is a control panel for the Claude Code CLI: a web UI and multi-agent orchestration
    around Claude Code, without giving up anything the CLI can do.
  maintainer: Jose Antonio Garrido <yeyochico@gmail.com>
  # Keep in step with build/linux/claudio.desktop, the template for the launcher entry
  desktop:
    entry:
      GenericName: Claude Code Control Panel
      Keywords: Claude;Claude Code;AI;agents;orchestration;
      # Must equal the window's WM_CLASS, which comes from extraMetadata.name above, or the launcher will
      # not group the running window under this entry
      StartupWMClass: claudio

deb:
  # Electron's own runtime libraries only: the server runs on Electron's bundled Node, so no nodejs package.
  # The Claude Code CLI is looked up on the user's PATH at run time and is not a package dependency either.
  # Tailscale (Settings > Remote access) is not a dependency either: it is not in Debian's archive,
  # and the tab says how to install it when it is missing.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
  # Not covered by electron-builder: AppStream metadata goes where software centres look for it.
  # Extra fpm arguments in `source=destination` form.
  fpm:
    - build/linux/io.github.yeyo11.claudio.metainfo.xml=/usr/share/metainfo/io.github.yeyo11.claudio.metainfo.xml
