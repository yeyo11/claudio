{{- $mode := .Values.auth.mode -}}
{{- if not (has $mode (list "none" "token" "oidc")) -}}
{{- fail (printf "auth.mode must be none, token or oidc, not %q" $mode) -}}
{{- end -}}
{{- if and (eq $mode "token") (not .Values.auth.token.existingSecret) (not .Values.auth.token.value) -}}
{{- fail "auth.mode is token: set auth.token.existingSecret (preferred) or auth.token.value" -}}
{{- end -}}
{{- if and .Values.secretKey.value (not (regexMatch "^[0-9a-fA-F]{64}$" .Values.secretKey.value)) -}}
{{- fail "secretKey.value must be 32 bytes as hex (openssl rand -hex 32)" -}}
{{- end -}}
{{- if and (hasKey .Values.env "CLAUDIO_SECRET_KEY") (include "claudio.secretKeySecret" .) -}}
{{- fail "CLAUDIO_SECRET_KEY is set in both env and secretKey: keep it in secretKey only" -}}
{{- end -}}
{{- if and (eq $mode "oidc") (or (not .Values.auth.oidc.issuer) (not .Values.auth.oidc.audience)) -}}
{{- fail "auth.mode is oidc: auth.oidc.issuer and auth.oidc.audience are required" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "claudio.fullname" . }}
  labels:
    {{- include "claudio.labels" . | nindent 4 }}
spec:
  # One pod: the SQLite store is shared by the API and the CLI processes it starts
  replicas: 1
  # Recreate, never a rolling update: the old and the new pod would open the same volume (and the
  # same database) at the same time
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "claudio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "claudio.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: claudio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: CLAUDIO_AUTH_MODE
              value: {{ $mode | quote }}
            - name: CLAUDIO_READ_ONLY
              value: {{ ternary "1" "0" .Values.auth.readOnly | quote }}
            # Always written, so the pod says what the release decided whatever the image defaults to
            - name: CLAUDIO_TUNNEL
              value: {{ ternary "on" "off" .Values.tunnel.enabled | quote }}
            - name: CLAUDIO_TERMINAL
              value: {{ ternary "on" "off" .Values.terminal.enabled | quote }}
            {{- if eq $mode "token" }}
            - name: CLAUDIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "claudio.tokenSecret" . }}
                  key: {{ .Values.auth.token.key }}
            {{- end }}
            {{- with include "claudio.secretKeySecret" . }}
            # From a Secret, so the key is not in the release; the server drops it from its
            # environment once read, so no agent it starts inherits it
            - name: CLAUDIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secretKey.key }}
            {{- end }}
            {{- if eq $mode "oidc" }}
            - name: CLAUDIO_OIDC_ISSUER
              value: {{ .Values.auth.oidc.issuer | quote }}
            - name: CLAUDIO_OIDC_AUDIENCE
              value: {{ .Values.auth.oidc.audience | quote }}
            - name: CLAUDIO_OIDC_CLIENT_ID
              value: {{ .Values.auth.oidc.clientId | quote }}
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if .Values.claude.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.claude.existingSecret }}
          {{- end }}
          # Kubernetes ignores the image's HEALTHCHECK, so the same probe is declared here. Unlike
          # Docker, a failing liveness probe does restart the container.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: state, mountPath: /data, subPath: data }
            - { name: state, mountPath: /home/node/.claude, subPath: claude }
            - { name: state, mountPath: /workspace, subPath: workspace }
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "claudio.claim" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
