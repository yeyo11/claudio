image:
  repository: ghcr.io/yeyo11/claudio
  # A release so that an upgrade is a decision; `latest` follows every release and `edge` every push
  # to main. The Claude Code version is baked into the image, not chosen here, and neither are the
  # other agents' (Codex, Gemini, Copilot, OpenCode). release-please moves this tag with every release.
  # Change both together or neither: a moving tag (`latest`, `edge`) needs pullPolicy: Always, or a
  # node that already holds the image serves yesterday's build - and a security fix - forever, while
  # a node scheduled fresh pulls a different one under the same name.
  tag: "0.8.1" # x-release-please-version
  pullPolicy: IfNotPresent

# The port the API listens on inside the pod and the one the Service exposes
port: 8797

service:
  type: ClusterIP

# Claudio keeps its state in a SQLite file shared by the API and the CLI processes it starts, so it
# is one pod on one volume. More than one replica would corrupt that store: the chart has no knob.

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    # Every chat is a `claude` process inside this pod, and each one runs shell commands of its own:
    # size both for the number you run at once (CLAUDIO_MAX_CONCURRENT_RUNS, 8 by default), not for
    # the API. The CPU limit is there so a pod full of busy agents throttles instead of taking the
    # node from everything else scheduled beside it - raise it before raising the concurrency.
    cpu: "4"
    memory: 4Gi

# One volume, mounted in three places by subPath: the wrapper state (/data), the account setup
# (~/.claude) and the projects (/workspace). Losing any of them on a
# restart would mean signing in again or losing work.
persistence:
  size: 20Gi
  storageClass: ""
  accessMode: ReadWriteOnce
  # Use a claim you created yourself instead of letting the chart create one
  existingClaim: ""

# The Claude account. Leave it empty and sign in from the app (Claude account, through the CLI's own
# sign-in, or an API key): the credentials stay on the data volume. Or name a Secret holding
# ANTHROPIC_API_KEY, which suits a deployment nobody can open a browser on. CLAUDE_CODE_OAUTH_TOKEN in
# that Secret is still read, for headless use only; it takes precedence over a sign-in made in the app.
claude:
  existingSecret: ""

# The key that seals the keys and tokens Claudio keeps for the CLIs (CLAUDIO_SECRET_KEY, 32 bytes as
# hex: `openssl rand -hex 32`). Without one the image makes a key on the first write and keeps it on
# the data volume beside what it seals, which protects a copy of the files but not the volume.
# Changing it later makes what the old key sealed read as absent: those keys are entered again.
secretKey:
  # Name of a Secret with the key under `key`. Preferred: the value never passes through Helm
  existingSecret: ""
  key: secret-key
  # Or a plain value, which the chart stores in a Secret it creates. Ends up in the release
  # history, so prefer existingSecret outside a test cluster.
  value: ""

# Authentication for the API.
# - `auto` (the default) writes no CLAUDIO_AUTH_MODE, so the image makes an owner token on the first
#   start of a fresh volume and prints it once in the pod's log (`kubectl logs`); the terminal and
#   in-app updates need it. A volume that already holds an auth.json keeps what it says.
# - `none` is only for a cluster you fully trust: whoever reaches the Service can run Claude on the
#   account, and the terminal and in-app updates stay unavailable.
# - `token` and `oidc` take their credentials from below. Behind an Ingress, use one of them.
auth:
  mode: auto # auto | none | token | oidc
  # Refuse every write except answering a permission prompt
  readOnly: false
  token:
    # Name of a Secret with the token under `key`. Preferred: the value never passes through Helm
    existingSecret: ""
    key: token
    # Or a plain value, which the chart stores in a Secret it creates. Ends up in the release
    # history, so prefer existingSecret outside a test cluster.
    value: ""
  oidc:
    issuer: ""
    audience: ""
    clientId: ""

# The tunnel through Tailscale (Settings > Remote access, `tailscale serve`, never Funnel), on as in
# the image: its entrypoint starts a tailscaled of its own in userspace networking (no NET_ADMIN, no
# /dev/net/tun), with its node state on the data volume, and the person signs it in from the app.
# Once it opens, tailnet members reach the server on 127.0.0.1 inside the pod, around this chart's
# Service, your Ingress and any NetworkPolicy on ingress. It refuses to open while auth is `none`,
# and only opens when someone starts it from the UI (or turns on "start with Claudio" there).
# `false` starts no tailscaled in the pod and offers no tunnel.
tunnel:
  enabled: true

# The person's own terminal (Settings > Terminal): a login shell in the pod, as user `node`, with the
# vault's tool credentials. `false` (the default) writes CLAUDIO_TERMINAL=off, which vetoes the
# feature for the whole deployment and shows it read-only in the UI; `true` writes `on`, which
# switches it on. Even then, with auth `none` it stays unavailable (every request reaches the pod
# from the bridge, not from loopback): it needs `token` or `oidc`, and a device other than the pod
# itself only reaches it through the tunnel.
terminal:
  enabled: false

# Extra environment variables for the container (CLAUDIO_MAX_CONCURRENT_RUNS, CLAUDIO_CLI_UPDATE_CHECK...).
# Plain values: a secret goes in `secretKey`, `auth.token` or `claude.existingSecret` instead.
env: {}

# Seconds SIGTERM has to stop the chats and close the store before SIGKILL
terminationGracePeriodSeconds: 30

probes:
  # Liveness restarts the container when the API stops answering; readiness takes the pod out of
  # the Service meanwhile. Neither depends on the Claude login: /api/health answers 200 while logged
  # out, because a restart would not fix that.
  # An in-app update (docs/plans/container-polish.md) boots the new bundle on trial for up to 60 s
  # before the launcher inside the container promotes it or rolls back, and /api/health answers late
  # during it. Liveness tolerates 30 s x 3 = 90 s, which fits that trial: keep periodSeconds x
  # failureThreshold above 60 s, or a slow trial gets the pod killed mid-update.
  liveness:
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 10
  startup:
    periodSeconds: 5
    failureThreshold: 24

podSecurityContext:
  # The image runs as `node` (uid 1000); fsGroup makes the volume writable for it
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true

# The container asks for nothing the wrapper needs: it binds one port above 1024 and starts
# processes as itself. Deliberately no readOnlyRootFilesystem - the agents write to /workspace and
# the CLI to /tmp, so a read-only root would break the first chat rather than harden anything.
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
