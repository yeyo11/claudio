# How Shipcast announces claudio (https://github.com/yeyo11/shipcast). Read at each release's tag.
enabled: true
brand: personal
language: en

# Launched by hand only: a release no longer creates a launch on its own (2026-11-07)
triggers:
  release: false
  manual: true

assets:
  # Every launch needs a demo; Instagram gets it as a Reel
  demo: docs/media/tour.gif

# Every channel keeps Shipcast's default except the newsletter, which is off unless a project asks
publishing:
  newsletter: approval

reddit:
  subreddits: [ClaudeAI, selfhosted, SideProject, opensource]
