name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Rebuild an existing release tag (e.g. v0.4.0) instead of running release-please; its packages can only be replaced while it is a draft
        required: false
        default: ''

# Runs queue rather than cancel: cancelling a release halfway leaves a tagged draft that no later push to
# main rebuilds, since release-please has already released it. A hung job therefore holds up every run
# behind it, which is why each job below, and in image.yml and desktop.yml, has a tight timeout.
concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Keeps a release pull request open, with the changelog and every version already bumped.
  # Merging it tags the commit and creates the GitHub release as a draft: releases are immutable once
  # published, so the packages are attached first and `publish` makes it public at the end. The tag is
  # created right away (`force-tag-creation`), since a draft has none and the next release needs it.
  please:
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    # Slowest successful run: 0.3 min over 49; 5 minutes is the floor for a job of API calls
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # GitHub does not trigger workflows on pushes made with GITHUB_TOKEN, so a release PR opened with it
      # never runs CI. An app token makes the release PR run CI like any other pull request. Without the
      # app configured (a fresh repository), releases still work on GITHUB_TOKEN; only that PR's CI waits.
      - id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Between releases, main publishes `edge` only: `latest` belongs to the newest release.
  edge:
    needs: please
    if: inputs.tag == '' && needs.please.outputs.released != 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      tags: |
        type=edge,branch=main
        type=sha,format=short

  # A release just landed, or one is being republished by hand: build it and move `latest` onto it.
  # The version is passed as `value` because metadata-action otherwise reads it
  # from the triggering event — a push to main, which carries no tag — and silently publishes none.
  release:
    needs: please
    if: always() && (inputs.tag != '' || needs.please.outputs.released == 'true')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ inputs.tag || needs.please.outputs.tag }}
      tags: |
        type=semver,pattern={{version}},value=${{ inputs.tag || needs.please.outputs.tag }}
        type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || needs.please.outputs.tag }}
        type=semver,pattern={{major}},value=${{ inputs.tag || needs.please.outputs.tag }}
        type=raw,value=latest

  # The Linux desktop app rides the same trigger as the image: AppImage and .deb are attached to the draft
  # release that was just created, with the signed desktop manifest. It also builds the signed apt
  # repository (apt-repo.yml, called from desktop.yml once the .deb exists), so `publish` waiting on this
  # job waits on the repository too. Its two jobs in the `release` environment, the manifest's signature
  # and the repository's, start together and take one approval.
  desktop:
    needs: please
    if: always() && (inputs.tag != '' || needs.please.outputs.released == 'true')
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/desktop.yml
    # A called workflow sees its environment's secrets (the signing keys) only when the caller hands them on
    secrets: inherit
    with:
      tag: ${{ inputs.tag || needs.please.outputs.tag }}

  # The signed server bundle a container updates itself from (docker/Dockerfile's bundle-export stage). It
  # fails, and so blocks `publish`, when the signing key is missing: an unsigned bundle is never published.
  server-bundle:
    needs: please
    if: always() && (inputs.tag != '' || needs.please.outputs.released == 'true')
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/server-bundle.yml
    # A called workflow sees its environment's secrets (the signing keys) only when the caller hands them on
    secrets: inherit
    with:
      tag: ${{ inputs.tag || needs.please.outputs.tag }}

  # Last step of a release: the draft goes public, and immutable, only once the image is pushed and the
  # packages, the signed bundle, the signed desktop manifest and the signed apt repository exist. A
  # failure before this leaves a draft to fix and publish, never a public release missing its files.
  publish:
    needs: [please, release, desktop, server-bundle]
    if: always() && (inputs.tag != '' || needs.please.outputs.released == 'true') && needs.release.result == 'success' && needs.desktop.result == 'success' && needs.server-bundle.result == 'success'
    runs-on: ubuntu-latest
    # About 3x the slowest successful run (1.4 min over 7), rounded up to 5 minutes
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        run: |
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false --latest
          else
            echo "$TAG is already published"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || needs.please.outputs.tag }}

  # The apt repository goes live only after the release is public: apt never offers a version whose
  # release is not. It deploys the Pages artifact desktop.yml's apt-repo built in this run
  # (docs/plans/unified-updates.md, D4 and D7).
  pages:
    needs: [please, publish]
    if: always() && (inputs.tag != '' || needs.please.outputs.released == 'true') && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Its deployment branch policy allows `main` only
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
