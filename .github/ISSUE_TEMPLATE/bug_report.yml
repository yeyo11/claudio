name: Bug report
description: Something behaves differently from what the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Claudio drives the Claude Code CLI, so most reports need to say which CLI it was
        talking to and how it was running. The fields below are what makes a report actionable.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the desktop app (or `docker compose up`)
        2. Start a chat with …
        3. The chat stays `Working` forever
    validations:
      required: true

  - type: dropdown
    id: how-running
    attributes:
      label: How are you running it
      options:
        - Desktop app (.deb)
        - Desktop app (AppImage)
        - Docker (docker run with ghcr.io/yeyo11/claudio)
        - Docker (docker compose)
        - Kubernetes (Helm chart)
        - Local dev (pnpm dev)
    validations:
      required: true

  - type: input
    id: cli-version
    attributes:
      label: Claude Code version
      description: "`claude --version`, or the `cli.version` field of `GET /api/system`."
    validations:
      required: true

  - type: input
    id: claudio-version
    attributes:
      label: Claudio version or commit
      description: "Settings → Account → Updates, the `current` of `GET /api/system/release`, or the commit."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: API logs, or the chat's events. Redact tokens before pasting.
      render: shell
