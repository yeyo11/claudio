# Sluice repository configuration, written by `sluice init`.
# Commit it: the gates are shared by everyone who works on this repository.
# weight: a number is a ceiling in budget units (roughly the CPU threads the
# gate uses); "auto" starts at half the daemon budget and learns a lower
# weight from measured runs (needs Sluice 0.4.0). An omitted weight means 1.
version = 1

[defaults]
agent_hook_policy = "fail-fast"   # fail-fast | wait | run-unqueued
human_hook_policy = "wait"        # wait | run-unqueued
tail_lines = 40

# Detected at the root: node (pnpm).
# Projects below the root are not configured; add their gates by hand:
#   apps/api (package.json)
#   apps/desktop (package.json)
#   apps/web (package.json)
#   packages/accounts (package.json)
#   packages/chat-ui (package.json)
#   packages/core (package.json)
#   packages/mcp (package.json)
#   packages/shared (package.json)
#   packages/ui (package.json)

[gates.lint]
# Detected from package.json.
cmd = "pnpm run lint"
weight = 2
timeout = "10m"
hooks = ["pre-commit"]
key_inputs = ["node --version", "pnpm --version"]

[gates.typecheck]
# Detected from package.json.
cmd = "pnpm run typecheck"
weight = 2
timeout = "10m"
hooks = ["pre-commit"]
key_inputs = ["node --version", "pnpm --version"]

[gates.test]
# Detected from package.json. A merge train installs the dependencies once, before its gates
# ([queue] prepare below), so the gate only tests
cmd = "pnpm test"
weight = "auto"
timeout = "30m"
hooks = ["pre-push"]
key_inputs = ["node --version", "pnpm --version"]
# One package at a time: four at once, each running its files in parallel, pushed the load past
# 30 on 12 threads and failed timing tests (a boot trial, an invite's expiry) that pass alone
env = { CI = "1", npm_config_workspace_concurrency = "1" }

[gates.ci-checks]
# What CI's `checks` job runs besides lint, typecheck and the tests: the OpenAPI drift, the
# docs/status.md counts, the build and the e2e runner's own tests (scripts/ci-checks.mjs, the same
# script CI calls). Before each push, so a branch never reaches CI with a failure only CI would see.
cmd = "pnpm run ci:checks"
weight = 2
timeout = "15m"
hooks = ["pre-push"]
key_inputs = ["node --version", "pnpm --version"]

[gates.e2e]
# The browser suite, on demand only (no hook): `verify` with gates = ["e2e"], and spec prefixes in
# extra_args to run only those. It builds first, so a cached pass always means this tree's UI.
# Two shards, each a server and a headless Chrome: the queue keeps them from running beside other
# heavy jobs, which is what froze the host when every agent ran four of its own
# (docs/decisions/e2e-through-sluice.md).
# `exec env -u` drops the variables that mark a process as an agent's (CLAUDIO_CHAT_ID,
# CLAUDIO_AGENT_RUN) and a chat's API credentials before anything starts, and `exec` leaves no
# marked process in the job: the terminal guard of the sandboxed server walks a client's ancestry
# for those marks, and an agent's verify otherwise failed every terminal spec. It changes nothing
# for the person's own terminal, which is another server. A daemon that inherited the marks when an
# agent started it still carries them above the job (reported to Sluice), so start it clean.
cmd = "exec env -u CLAUDIO_CHAT_ID -u CLAUDIO_AGENT_RUN -u CLAUDIO_API_URL -u CLAUDIO_API_TOKEN pnpm run e2e:gate"
weight = "auto"
timeout = "45m"
key_inputs = ["node --version", "pnpm --version"]
# Failure screenshots go to e2e-shots/ at the root (ignored by git), as on GitHub
# E2E_TIMEOUT: the runner's own cap on the whole run (25 min by default) was what two shards took here
# already (1,450-1,460 s in November 2026); 40 min stays inside the gate's 45. CI runs four shards
env = { E2E_SHARDS = "2", E2E_SHOTS = "e2e-shots", E2E_TIMEOUT = "2400000", npm_config_workspace_concurrency = "1" }

[queue]
# A merge train verifies in a fresh worktree without node_modules: install once, before the gates
# (Sluice 0.6.0; a failure is attributed by installing the target alone, josegarridodigio/sluice#3)
prepare = "pnpm install --frozen-lockfile --prefer-offline"
